<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>P2P Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a78bfa, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        #status {
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #8b949e;
            flex-shrink: 0;
            transition: background 0.3s;
        }

        #status-dot.connected { background: #3fb950; box-shadow: 0 0 6px #3fb950; animation: pulse 2s infinite; }
        #status-dot.waiting   { background: #d29922; box-shadow: 0 0 6px #d29922; }
        #status-dot.error     { background: #f85149; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.4; }
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%;
            max-width: 680px;
        }

        /* ── Videos ── */
        #video-card {
            padding: 12px;
            margin-bottom: 12px;
        }

        #videos {
            display: flex;
            gap: 10px;
        }

        .video-wrap {
            flex: 1;
            position: relative;
        }

        .video-wrap video {
            width: 100%;
            aspect-ratio: 4/3;
            background: #0d1117;
            border-radius: 8px;
            object-fit: cover;
            display: block;
        }

        .video-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #fff;
            background: rgba(0,0,0,0.55);
            padding: 2px 7px;
            border-radius: 99px;
            backdrop-filter: blur(4px);
        }

        #video-controls {
            margin-top: 10px;
            display: flex;
            justify-content: center;
        }

        /* ── Messages ── */
        #chat-card {
            padding: 0;
            overflow: hidden;
            margin-bottom: 12px;
        }

        #messages {
            height: 220px;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #messages::-webkit-scrollbar { width: 4px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

        .bubble {
            max-width: 70%;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 0.88rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .bubble.you {
            align-self: flex-end;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .bubble.peer {
            align-self: flex-start;
            background: #21262d;
            color: #e6edf3;
            border-bottom-left-radius: 4px;
        }

        .bubble .who {
            font-size: 0.7rem;
            opacity: 0.65;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .system-msg {
            align-self: center;
            font-size: 0.73rem;
            color: #8b949e;
            padding: 2px 10px;
            background: #21262d;
            border-radius: 99px;
        }

        #input-row {
            display: flex;
            gap: 0;
            border-top: 1px solid #30363d;
        }

        #msg {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e6edf3;
            padding: 12px 16px;
            font-size: 0.9rem;
        }

        #msg::placeholder { color: #484f58; }

        #send {
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            color: #fff;
            border: none;
            padding: 0 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        #send:disabled { opacity: 0.35; cursor: default; }
        #send:not(:disabled):hover { opacity: 0.85; }

        /* ── Buttons ── */
        .btn {
            background: #21262d;
            color: #e6edf3;
            border: 1px solid #30363d;
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 0.83rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
        }

        .btn:hover { background: #30363d; border-color: #8b949e; }

        .btn.active {
            background: #3d1e6e;
            border-color: #a78bfa;
            color: #a78bfa;
            box-shadow: 0 0 10px rgba(167,139,250,0.3);
        }

        /* ── Room chip ── */
        #room-chip {
            font-size: 0.72rem;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 99px;
            padding: 2px 10px;
            color: #8b949e;
            margin-bottom: 16px;
        }

        #room-chip span { color: #a78bfa; font-weight: 600; }
    </style>
</head>
<body>
    <h2>P2P Chat</h2>

    <div id="status">
        <div id="status-dot"></div>
        <span id="status-text">Connecting…</span>
    </div>

    <div id="room-chip">room: <span id="room-name"></span></div>

    <div class="card" id="video-card">
        <div id="videos">
            <div class="video-wrap">
                <video id="local-video" autoplay muted playsinline></video>
                <div class="video-label">You</div>
            </div>
            <div class="video-wrap">
                <video id="remote-video" autoplay playsinline></video>
                <div class="video-label">Peer</div>
            </div>
        </div>
        <div id="video-controls">
            <button class="btn" id="toggle-video">🎥 Start Video</button>
        </div>
    </div>

    <div class="card" id="chat-card">
        <div id="messages"></div>
        <div id="input-row">
            <input id="msg" type="text" placeholder="Type a message…" disabled />
            <button id="send" disabled>Send</button>
        </div>
    </div>

    <script src="client.js"></script>
</body>
</html>
