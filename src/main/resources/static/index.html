<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Interview Room</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0d1117;
            color: #e6edf3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid #21262d;
            flex-shrink: 0;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a78bfa, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            color: #8b949e;
        }

        #status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #484f58;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        #status-dot.connected  { background: #3fb950; box-shadow: 0 0 5px #3fb950; animation: pulse 2s infinite; }
        #status-dot.waiting    { background: #d29922; box-shadow: 0 0 5px #d29922; }
        #status-dot.error      { background: #f85149; }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        #room-chip {
            margin-left: auto;
            font-size: 0.72rem;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 99px;
            padding: 2px 10px;
            color: #8b949e;
        }
        #room-chip span { color: #a78bfa; font-weight: 600; }

        /* ── Main layout ── */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── Left sidebar: video + chat ── */
        #sidebar {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #21262d;
        }

        #videos {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        #video-row { display: flex; gap: 6px; }

        .video-wrap {
            flex: 1;
            position: relative;
            background: #0d1117;
            border-radius: 6px;
            overflow: hidden;
        }

        .video-wrap video {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            display: block;
        }

        .video-label {
            position: absolute;
            bottom: 4px; left: 6px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #fff;
            background: rgba(0,0,0,.5);
            padding: 1px 6px;
            border-radius: 99px;
        }

        #toggle-video {
            width: 100%;
            padding: 6px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
        }
        #toggle-video:hover { background: #30363d; }
        #toggle-video.active { background: #3d1e6e; border-color: #a78bfa; color: #a78bfa; }

        /* ── Chat ── */
        #chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-top: 1px solid #21262d;
        }

        #chat-label {
            padding: 6px 12px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #484f58;
            text-transform: uppercase;
            letter-spacing: .05em;
            flex-shrink: 0;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        #messages::-webkit-scrollbar { width: 3px; }
        #messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

        .bubble {
            max-width: 85%;
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 0.82rem;
            line-height: 1.4;
            word-break: break-word;
        }
        .bubble.you  { align-self: flex-end; background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff; border-bottom-right-radius: 3px; }
        .bubble.peer { align-self: flex-start; background: #21262d; color: #e6edf3; border-bottom-left-radius: 3px; }
        .bubble .who { font-size: 0.65rem; opacity: .6; margin-bottom: 2px; font-weight: 600; }

        .system-msg {
            align-self: center;
            font-size: 0.68rem;
            color: #8b949e;
            background: #161b22;
            padding: 2px 8px;
            border-radius: 99px;
        }

        #input-row {
            display: flex;
            border-top: 1px solid #21262d;
            flex-shrink: 0;
        }

        #msg {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e6edf3;
            padding: 10px 12px;
            font-size: 0.82rem;
        }
        #msg::placeholder { color: #484f58; }

        #send {
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            color: #fff;
            border: none;
            padding: 0 14px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
        }
        #send:disabled { opacity: .3; cursor: default; }

        /* ── Right panel: tabs ── */
        #panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        #tabs {
            display: flex;
            border-bottom: 1px solid #21262d;
            flex-shrink: 0;
        }

        .tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color .15s, border-color .15s;
        }
        .tab:hover { color: #e6edf3; }
        .tab.active { color: #e6edf3; border-bottom-color: #a78bfa; }

        .tab-panel { display: none; flex: 1; flex-direction: column; min-height: 0; }
        .tab-panel.active { display: flex; }

        /* ── Code panel ── */
        #lang-bar {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
            border-bottom: 1px solid #21262d;
            flex-shrink: 0;
        }

        .lang-btn {
            padding: 3px 12px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #8b949e;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }
        .lang-btn:hover { color: #e6edf3; }
        .lang-btn.active { background: #3d1e6e; border-color: #a78bfa; color: #a78bfa; }

        #editor {
            flex: 1;
            overflow: hidden;
        }

        /* CodeMirror overrides */
        .cm-editor { height: 100%; font-size: 13px; }
        .cm-scroller { overflow: auto; }

        /* ── Whiteboard panel ── */
        #diagram-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-bottom: 1px solid #21262d;
            flex-shrink: 0;
        }

        .legend {
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend.you   { color: #a78bfa; }
        .legend.peer  { color: #38bdf8; }

        .tool-btn {
            padding: 3px 12px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }
        .tool-btn:hover { background: #30363d; }
        .tool-btn.active { background: #3d1e6e; border-color: #a78bfa; color: #a78bfa; }

        #diagram-tools { display: flex; gap: 4px; }
        #clear-canvas { margin-left: auto; }

        #whiteboard {
            flex: 1;
            display: block;
            cursor: crosshair;
            touch-action: none;
        }
    </style>
</head>
<body>

<header>
    <h2>⚡ Interview Room</h2>
    <div id="status">
        <div id="status-dot"></div>
        <span id="status-text">Connecting…</span>
    </div>
    <div id="room-chip">room: <span id="room-name"></span></div>
</header>

<main>
    <!-- Left sidebar -->
    <aside id="sidebar">
        <div id="videos">
            <div id="video-row">
                <div class="video-wrap">
                    <video id="local-video" autoplay muted playsinline></video>
                    <div class="video-label">You</div>
                </div>
                <div class="video-wrap">
                    <video id="remote-video" autoplay playsinline></video>
                    <div class="video-label">Peer</div>
                </div>
            </div>
            <button id="toggle-video">🎥 Start Video</button>
        </div>

        <div id="chat-section">
            <div id="chat-label">Chat</div>
            <div id="messages"></div>
            <div id="input-row">
                <input id="msg" type="text" placeholder="Type a message…" disabled />
                <button id="send" disabled>Send</button>
            </div>
        </div>
    </aside>

    <!-- Right panel -->
    <div id="panel">
        <div id="tabs">
            <button class="tab active" data-tab="code">💻 Code</button>
            <button class="tab" data-tab="diagram">✏️ Whiteboard</button>
        </div>

        <!-- Code tab -->
        <div id="tab-code" class="tab-panel active">
            <div id="lang-bar">
                <button class="lang-btn active" data-lang="js">JavaScript</button>
                <button class="lang-btn" data-lang="java">Java</button>
                <button class="lang-btn" data-lang="c">C</button>
                <button class="lang-btn" data-lang="cpp">C++</button>
            </div>
            <div id="editor"></div>
        </div>

        <!-- Whiteboard tab -->
        <div id="tab-diagram" class="tab-panel">
            <div id="diagram-toolbar">
                <span class="legend you">● You</span>
                <span class="legend peer">● Peer</span>
                <div id="diagram-tools">
                    <button class="tool-btn active" id="tool-pen">✏ Pen</button>
                    <button class="tool-btn" id="tool-eraser">◻ Eraser</button>
                </div>
                <button class="tool-btn" id="clear-canvas">Clear All</button>
            </div>
            <canvas id="whiteboard"></canvas>
        </div>
    </div>
</main>

<script type="module" src="client.js"></script>
</body>
</html>
