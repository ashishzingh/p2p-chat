<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Interview Room</title>
    <style>
        /* ── Theming ── */
        :root {
            --bg-0: #0d1117;
            --bg-1: #161b22;
            --bg-2: #21262d;
            --bg-3: #30363d;
            --text-0: #e6edf3;
            --text-1: #8b949e;
            --text-2: #484f58;
            --accent: #a78bfa;
            --accent-b: #38bdf8;
            --green: #3fb950;
            --red: #f85149;
            --yellow: #d29922;
            --grad: linear-gradient(135deg, #7c3aed, #2563eb);
            --shadow: 0 4px 24px rgba(0,0,0,.4);
            --transition: .18s ease;
        }
        body.light {
            --bg-0: #f6f8fa;
            --bg-1: #ffffff;
            --bg-2: #eaeef2;
            --bg-3: #d0d7de;
            --text-0: #1f2328;
            --text-1: #636c76;
            --text-2: #9198a1;
            --accent: #7c3aed;
            --accent-b: #0969da;
            --green: #1a7f37;
            --red: #d1242f;
            --yellow: #9a6700;
            --grad: linear-gradient(135deg, #7c3aed, #0969da);
            --shadow: 0 4px 24px rgba(0,0,0,.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg-0);
            color: var(--text-0);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background var(--transition), color var(--transition);
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 16px;
            border-bottom: 1px solid var(--bg-3);
            flex-shrink: 0;
            background: var(--bg-1);
            box-shadow: var(--shadow);
            position: relative;
            z-index: 10;
        }
        header::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 0; right: 0;
            height: 2px;
            background: var(--grad);
            opacity: .6;
        }

        h2 {
            font-size: 1rem;
            font-weight: 800;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -.3px;
        }

        #status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.73rem;
            color: var(--text-1);
        }
        #status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--text-2);
            transition: background var(--transition), box-shadow var(--transition);
        }
        #status-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
        #status-dot.waiting   { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); animation: pulse 1.4s infinite; }
        #status-dot.error     { background: var(--red); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

        #room-chip {
            margin-left: auto;
            font-size: 0.7rem;
            background: var(--bg-2);
            border: 1px solid var(--bg-3);
            border-radius: 99px;
            padding: 2px 10px;
            color: var(--text-1);
            transition: background var(--transition);
        }
        #room-chip span { color: var(--accent); font-weight: 700; }

        .icon-btn {
            background: var(--bg-2);
            border: 1px solid var(--bg-3);
            border-radius: 7px;
            color: var(--text-0);
            width: 30px; height: 30px;
            display: grid; place-items: center;
            font-size: .9rem;
            cursor: pointer;
            transition: background var(--transition), transform .1s;
        }
        .icon-btn:hover { background: var(--bg-3); transform: scale(1.08); }

        /* ── Layout ── */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── Sidebar ── */
        #sidebar {
            width: 270px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--bg-3);
            background: var(--bg-1);
        }

        #videos {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            flex-shrink: 0;
        }
        #video-row { display: flex; gap: 6px; }
        .video-wrap {
            flex: 1;
            position: relative;
            background: var(--bg-0);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--bg-3);
        }
        .video-wrap video {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            display: block;
        }
        .video-label {
            position: absolute;
            bottom: 5px; left: 7px;
            font-size: 0.62rem;
            font-weight: 700;
            color: #fff;
            background: rgba(0,0,0,.52);
            padding: 1px 6px;
            border-radius: 99px;
        }

        #toggle-video {
            width: 100%;
            padding: 6px;
            background: var(--bg-2);
            border: 1px solid var(--bg-3);
            border-radius: 7px;
            color: var(--text-0);
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--transition);
        }
        #toggle-video:hover { background: var(--bg-3); }
        #toggle-video.active {
            background: color-mix(in srgb, var(--accent) 15%, transparent);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ── Chat ── */
        #chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-top: 1px solid var(--bg-3);
        }
        #chat-label {
            padding: 5px 12px;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: .06em;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #messages::-webkit-scrollbar { width: 3px; }
        #messages::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 2px; }

        .bubble {
            max-width: 87%;
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            line-height: 1.45;
            word-break: break-word;
            animation: popIn .15s ease;
        }
        @keyframes popIn { from{transform:scale(.94);opacity:0} to{transform:scale(1);opacity:1} }
        .bubble.you  { align-self: flex-end; background: var(--grad); color: #fff; border-bottom-right-radius: 3px; }
        .bubble.peer { align-self: flex-start; background: var(--bg-2); color: var(--text-0); border-bottom-left-radius: 3px; }
        .bubble .who { font-size: 0.62rem; opacity: .6; margin-bottom: 2px; font-weight: 700; }

        .system-msg {
            align-self: center;
            font-size: 0.67rem;
            color: var(--text-1);
            background: var(--bg-2);
            padding: 2px 9px;
            border-radius: 99px;
            border: 1px solid var(--bg-3);
        }

        #input-row {
            display: flex;
            border-top: 1px solid var(--bg-3);
            flex-shrink: 0;
        }
        #msg {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-0);
            padding: 10px 12px;
            font-size: 0.8rem;
        }
        #msg::placeholder { color: var(--text-2); }
        #send {
            background: var(--grad);
            color: #fff;
            border: none;
            padding: 0 14px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity var(--transition);
        }
        #send:disabled { opacity: .25; cursor: default; }
        #send:not(:disabled):hover { opacity: .85; }

        /* ── Right panel ── */
        #panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg-0);
        }

        /* ── Tabs ── */
        #tabs {
            display: flex;
            border-bottom: 1px solid var(--bg-3);
            flex-shrink: 0;
            background: var(--bg-1);
        }
        .tab {
            padding: 9px 20px;
            background: transparent;
            border: none;
            color: var(--text-1);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color var(--transition), border-color var(--transition);
        }
        .tab:hover { color: var(--text-0); }
        .tab.active { color: var(--text-0); border-bottom-color: var(--accent); }

        .tab-panel { display: none; flex: 1; flex-direction: column; min-height: 0; }
        .tab-panel.active { display: flex; }

        /* ── Code panel ── */
        #lang-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 7px 10px;
            border-bottom: 1px solid var(--bg-3);
            flex-shrink: 0;
            background: var(--bg-1);
        }
        .lang-btn {
            padding: 3px 11px;
            background: var(--bg-2);
            border: 1px solid var(--bg-3);
            border-radius: 6px;
            color: var(--text-1);
            font-size: 0.73rem;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }
        .lang-btn:hover { color: var(--text-0); background: var(--bg-3); }
        .lang-btn.active {
            background: color-mix(in srgb, var(--accent) 15%, transparent);
            border-color: var(--accent);
            color: var(--accent);
        }
        #run-btn {
            margin-left: auto;
            padding: 4px 14px;
            background: var(--grad);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity var(--transition), transform .1s;
            display: flex; align-items: center; gap: 5px;
        }
        #run-btn:hover { opacity: .85; transform: scale(1.03); }
        #run-btn.running { animation: runPulse .6s infinite alternate; }
        @keyframes runPulse { from{opacity:.7} to{opacity:1} }

        #editor { flex: 1; overflow: hidden; min-height: 0; }
        .cm-editor { height: 100%; font-size: 13px; }
        .cm-scroller { overflow: auto !important; }

        /* ── Output panel ── */
        #output-section {
            height: 150px;
            border-top: 1px solid var(--bg-3);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background: var(--bg-1);
        }
        #output-header {
            display: flex;
            align-items: center;
            padding: 4px 10px;
            border-bottom: 1px solid var(--bg-3);
            gap: 8px;
            flex-shrink: 0;
        }
        #output-header span {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: .06em;
        }
        #output-header .badge {
            font-size: 0.62rem;
            padding: 1px 7px;
            border-radius: 99px;
            font-weight: 600;
        }
        .badge.ok  { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }
        .badge.err { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }
        .badge.info { background: color-mix(in srgb, var(--accent-b) 15%, transparent); color: var(--accent-b); }
        #clear-output-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--text-2);
            cursor: pointer;
            font-size: .8rem;
            padding: 2px 6px;
            border-radius: 4px;
        }
        #clear-output-btn:hover { color: var(--text-1); }
        #output-text {
            flex: 1;
            overflow: auto;
            padding: 8px 12px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.75rem;
            line-height: 1.5;
            color: var(--text-0);
            white-space: pre-wrap;
        }
        #output-text::-webkit-scrollbar { width: 3px; height: 3px; }
        #output-text::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 2px; }

        /* ── Whiteboard panel ── */
        #diagram-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-bottom: 1px solid var(--bg-3);
            flex-shrink: 0;
            background: var(--bg-1);
            flex-wrap: wrap;
        }
        .tool-btn {
            padding: 3px 11px;
            background: var(--bg-2);
            border: 1px solid var(--bg-3);
            border-radius: 6px;
            color: var(--text-0);
            font-size: 0.73rem;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition), color var(--transition);
        }
        .tool-btn:hover { background: var(--bg-3); }
        .tool-btn.active {
            background: color-mix(in srgb, var(--accent) 15%, transparent);
            border-color: var(--accent);
            color: var(--accent);
        }

        #color-swatches { display: flex; align-items: center; gap: 5px; }
        .swatch {
            width: 20px; height: 20px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            padding: 0;
            transition: transform .12s, border-color .12s;
        }
        .swatch:hover { transform: scale(1.2); }
        .swatch.active { border-color: var(--text-0); transform: scale(1.15); }
        #custom-color {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 2px solid var(--bg-3);
            cursor: pointer;
            padding: 0;
            background: none;
        }

        .diagram-legend {
            font-size: 0.7rem;
            font-weight: 700;
            display: flex; align-items: center; gap: 4px;
        }
        .diagram-legend.you  { color: var(--accent); }
        .diagram-legend.peer { color: var(--accent-b); }

        #whiteboard {
            flex: 1;
            display: block;
            cursor: crosshair;
            touch-action: none;
            background: var(--bg-0);
        }

        /* ── Home screen ── */
        #home-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-0);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity .25s ease;
        }
        #home-screen.hiding { opacity: 0; pointer-events: none; }

        #home-card {
            background: var(--bg-1);
            border: 1px solid var(--bg-3);
            border-radius: 18px;
            padding: 44px 40px;
            width: 400px;
            box-shadow: var(--shadow);
            animation: slideUp .3s ease;
        }
        #home-card h2 {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        #home-subtitle {
            font-size: 0.8rem;
            color: var(--text-1);
            line-height: 1.5;
            margin-bottom: 28px;
        }
        #create-room-btn {
            width: 100%;
            padding: 13px;
            background: var(--grad);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity var(--transition), transform .1s;
        }
        #create-room-btn:hover { opacity: .88; transform: scale(1.01); }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            color: var(--text-2);
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--bg-3);
        }

        #join-code-row {
            display: flex;
            gap: 8px;
        }
        #join-code-input {
            flex: 1;
            padding: 10px 13px;
            background: var(--bg-0);
            border: 1.5px solid var(--bg-3);
            border-radius: 9px;
            color: var(--text-0);
            font-size: 0.88rem;
            outline: none;
            transition: border-color var(--transition);
        }
        #join-code-input::placeholder { color: var(--text-2); }
        #join-code-input:focus { border-color: var(--accent); }
        #join-code-btn {
            padding: 10px 16px;
            background: var(--bg-2);
            border: 1.5px solid var(--bg-3);
            border-radius: 9px;
            color: var(--text-0);
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: background var(--transition);
            white-space: nowrap;
        }
        #join-code-btn:hover { background: var(--bg-3); }

        /* ── Join screen ── */
        #join-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-0);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity .25s ease;
        }
        #join-screen.visible { display: flex; }
        #join-screen.hiding {
            opacity: 0;
            pointer-events: none;
        }

        #join-card {
            background: var(--bg-1);
            border: 1px solid var(--bg-3);
            border-radius: 18px;
            padding: 40px 36px;
            width: 380px;
            box-shadow: var(--shadow);
            animation: slideUp .3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(18px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        #join-card h2 {
            font-size: 1.3rem;
            font-weight: 800;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        #join-subtitle {
            font-size: 0.8rem;
            color: var(--text-1);
            margin-bottom: 28px;
        }

        #join-room-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-2);
            border: 1px solid var(--bg-3);
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 20px;
        }
        #join-room-row .label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: .05em;
            flex-shrink: 0;
        }
        #join-room-display {
            flex: 1;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--accent);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #copy-link-btn {
            background: none;
            border: none;
            color: var(--text-1);
            cursor: pointer;
            font-size: .8rem;
            padding: 2px 6px;
            border-radius: 5px;
            transition: color var(--transition), background var(--transition);
            flex-shrink: 0;
        }
        #copy-link-btn:hover { color: var(--text-0); background: var(--bg-3); }

        #join-name-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-1);
            margin-bottom: 7px;
            display: block;
        }
        #name-input {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg-0);
            border: 1.5px solid var(--bg-3);
            border-radius: 9px;
            color: var(--text-0);
            font-size: 0.95rem;
            outline: none;
            transition: border-color var(--transition);
        }
        #name-input::placeholder { color: var(--text-2); }
        #name-input:focus { border-color: var(--accent); }

        #join-btn {
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            background: var(--grad);
            border: none;
            border-radius: 9px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity var(--transition), transform .1s;
        }
        #join-btn:hover:not(:disabled) { opacity: .88; transform: scale(1.01); }
        #join-btn:disabled { opacity: .35; cursor: default; }
    </style>
</head>
<body>

<!-- Home screen — shown when no room is specified -->
<div id="home-screen">
    <div id="home-card">
        <h2>⚡ Interview Room</h2>
        <p id="home-subtitle">Private, peer-to-peer interview sessions.<br>Code together, draw, chat — no account needed.</p>
        <button id="create-room-btn">+ Create New Room</button>
        <div class="divider"><span>or join with a code</span></div>
        <div id="join-code-row">
            <input id="join-code-input" type="text" placeholder="room-code" autocomplete="off" />
            <button id="join-code-btn">Join →</button>
        </div>
    </div>
</div>

<!-- Join screen — shown when room is known but name not yet entered -->
<div id="join-screen">
    <div id="join-card">
        <h2>⚡ Interview Room</h2>
        <p id="join-subtitle">Set your name before joining</p>

        <div id="join-room-row">
            <span class="label">Room</span>
            <span id="join-room-display"></span>
            <button id="copy-link-btn" title="Copy invite link">📋 Copy link</button>
        </div>

        <label id="join-name-label" for="name-input">Your name</label>
        <input id="name-input" type="text" placeholder="e.g. Ashish" maxlength="30" autocomplete="off" />
        <button id="join-btn" disabled>Join Room →</button>
    </div>
</div>

<header>
    <h2>⚡ Interview Room</h2>
    <div id="status">
        <div id="status-dot"></div>
        <span id="status-text">Connecting…</span>
    </div>
    <div id="room-chip">room: <span id="room-name"></span></div>
    <button class="icon-btn" id="theme-toggle" title="Toggle theme">🌙</button>
</header>

<main>
    <aside id="sidebar">
        <div id="videos">
            <div id="video-row">
                <div class="video-wrap">
                    <video id="local-video" autoplay muted playsinline></video>
                    <div class="video-label" id="local-label">You</div>
                </div>
                <div class="video-wrap">
                    <video id="remote-video" autoplay playsinline></video>
                    <div class="video-label" id="remote-label">Peer</div>
                </div>
            </div>
            <button id="toggle-video">🎥 Start Video</button>
        </div>

        <div id="chat-section">
            <div id="chat-label">Chat</div>
            <div id="messages"></div>
            <div id="input-row">
                <input id="msg" type="text" placeholder="Type a message…" disabled />
                <button id="send" disabled>Send</button>
            </div>
        </div>
    </aside>

    <div id="panel">
        <div id="tabs">
            <button class="tab active" data-tab="code">💻 Code</button>
            <button class="tab" data-tab="diagram">✏️ Whiteboard</button>
        </div>

        <!-- Code tab -->
        <div id="tab-code" class="tab-panel active">
            <div id="lang-bar">
                <button class="lang-btn active" data-lang="js">JavaScript</button>
                <button class="lang-btn" data-lang="java">Java</button>
                <button class="lang-btn" data-lang="c">C</button>
                <button class="lang-btn" data-lang="cpp">C++</button>
                <button id="run-btn">▶ Run</button>
            </div>
            <div id="editor"></div>
            <div id="output-section">
                <div id="output-header">
                    <span>Output</span>
                    <span id="output-badge" class="badge info">ready</span>
                    <button id="clear-output-btn" title="Clear output">✕</button>
                </div>
                <pre id="output-text">// Click ▶ Run to execute JavaScript</pre>
            </div>
        </div>

        <!-- Whiteboard tab -->
        <div id="tab-diagram" class="tab-panel">
            <div id="diagram-toolbar">
                <button class="tool-btn active" id="tool-pen">✏ Pen</button>
                <button class="tool-btn" id="tool-eraser">◻ Eraser</button>
                <div id="color-swatches">
                    <button class="swatch active" data-color="#a78bfa" style="background:#a78bfa" title="Purple"></button>
                    <button class="swatch" data-color="#38bdf8" style="background:#38bdf8" title="Blue"></button>
                    <button class="swatch" data-color="#3fb950" style="background:#3fb950" title="Green"></button>
                    <button class="swatch" data-color="#f85149" style="background:#f85149" title="Red"></button>
                    <button class="swatch" data-color="#d29922" style="background:#d29922" title="Yellow"></button>
                    <button class="swatch" data-color="#e6edf3" style="background:#e6edf3" title="White"></button>
                    <button class="swatch" data-color="#1f2328" style="background:#1f2328;border:1px solid #555" title="Black"></button>
                    <input type="color" id="custom-color" value="#a78bfa" title="Custom colour">
                </div>
                <button class="tool-btn" id="undo-btn" title="Undo (Ctrl+Z)">↩</button>
                <button class="tool-btn" id="redo-btn" title="Redo (Ctrl+Y)">↪</button>
                <div style="display:flex;gap:8px;margin-left:auto;align-items:center">
                    <span class="diagram-legend you">● You</span>
                    <span class="diagram-legend peer">● Peer</span>
                    <button class="tool-btn" id="clear-canvas">Clear All</button>
                </div>
            </div>
            <canvas id="whiteboard"></canvas>
        </div>
    </div>
</main>

<script type="module" src="client.js"></script>
</body>
</html>
