<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>P2P Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
        #status { margin-bottom: 8px; color: #666; font-size: 0.9em; }
        #videos { display: flex; gap: 8px; margin-bottom: 8px; }
        video { width: 50%; background: #111; border-radius: 6px; aspect-ratio: 4/3; }
        #controls { margin-bottom: 8px; }
        #toggle-video { padding: 6px 14px; }
        #messages { border: 1px solid #ccc; height: 200px; overflow-y: auto; padding: 8px; margin-bottom: 8px; }
        #input-row { display: flex; gap: 8px; }
        #msg { flex: 1; padding: 6px; }
    </style>
</head>
<body>
    <h2>P2P Chat</h2>
    <div id="status">Connecting...</div>

    <div id="videos">
        <video id="local-video" autoplay muted playsinline></video>
        <video id="remote-video" autoplay playsinline></video>
    </div>
    <div id="controls">
        <button id="toggle-video">Start Video</button>
    </div>

    <div id="messages"></div>
    <div id="input-row">
        <input id="msg" type="text" placeholder="Type a message..." disabled />
        <button id="send" disabled>Send</button>
    </div>
    <script src="client.js"></script>
</body>
</html>
