<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>P2P Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
        #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 8px; margin-bottom: 8px; }
        #input-row { display: flex; gap: 8px; }
        #msg { flex: 1; padding: 6px; }
        #status { margin-bottom: 8px; color: #666; font-size: 0.9em; }
    </style>
</head>
<body>
    <h2>P2P Chat</h2>
    <div id="status">Connecting...</div>
    <div id="messages"></div>
    <div id="input-row">
        <input id="msg" type="text" placeholder="Type a message..." disabled />
        <button id="send" disabled>Send</button>
    </div>
    <script src="client.js"></script>
</body>
</html>
