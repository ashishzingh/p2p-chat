server.forward-headers-strategy=native

# Static assets: no-cache so browsers always revalidate after deploys
spring.web.resources.cache.cachecontrol.no-cache=true

# ── TURN server ───────────────────────────────────────────────────────────────
turn.enabled=false
# mode: 'static' for managed services (Metered, Xirsys, Twilio…)
#        'hmac'   for self-hosted coturn with use-auth-secret
turn.mode=static
turn.host=
turn.udp-port=3478
turn.tcp-port=3478
turn.tls-port=5349
# static mode
turn.username=
turn.password=
# hmac mode
turn.secret=
turn.credential-ttl-seconds=86400

# ── Admin API ─────────────────────────────────────────────────────────────────
# Change this before deploying. All /admin/* endpoints require X-Admin-Key header.
admin.key=change-me
